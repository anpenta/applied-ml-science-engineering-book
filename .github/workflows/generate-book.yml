name: Generate book

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and validate editions
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.validate-tag.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate release tag
        id: validate-tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          number = r"(?:0|[1-9][0-9]*)"
          prerelease_id = rf"(?:{number}|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)"
          build_id = r"[0-9A-Za-z-]+"
          pattern = re.compile(
              rf"v{number}\.{number}\.{number}"
              rf"(?:-(?P<prerelease>{prerelease_id}(?:\.{prerelease_id})*))?"
              rf"(?:\+(?:{build_id})(?:\.{build_id})*)?"
          )
          tag = os.environ["RELEASE_TAG"]
          match = pattern.fullmatch(tag)
          if match is None:
              sys.exit(f"Invalid release tag {tag!r}; expected vMAJOR.MINOR.PATCH with optional SemVer prerelease or build metadata.")

          is_prerelease = "true" if match.group("prerelease") else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"prerelease={is_prerelease}\n")
          PY

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes texlive-xetex texlive-latex-extra poppler-utils librsvg2-bin default-jre-headless unzip zip

      - name: Install Pandoc
        run: |
          version=3.13
          archive="/tmp/pandoc-${version}-1-amd64.deb"
          curl --fail --location --silent --show-error \
            "https://github.com/jgm/pandoc/releases/download/${version}/pandoc-${version}-1-amd64.deb" \
            --output "${archive}"
          echo "7e3736f255090296ca5d1a14291a76b9b3c43cd385011b1621a4d0c16091a70f  ${archive}" \
            | sha256sum --check
          sudo dpkg --install "${archive}"
          pandoc --version

      - name: Run code example checks
        run: python scripts/validate_code_examples.py

      - name: Build book editions
        run: python scripts/build_book.py --format all

      - name: Verify book marks on HTML and EPUB title pages
        run: python scripts/validate_title_marks.py

      - name: Validate HTML page structure and navigation
        run: python scripts/validate_html_pages.py

      - name: Validate HTML, CSS, and SVG output
        run: |
          archive=/tmp/vnu.jar
          # Nu validator uses a rolling "latest" release, so we cannot reliably pin a version.
          # This makes validation less reproducible, but avoids relying on unstable asset IDs.
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/validator/validator/releases/download/latest/vnu.jar" \
            --output "${archive}"
          java -jar "${archive}" --also-check-css --also-check-svg \
            dist/*.html dist/assets/book.css dist/assets/*.svg

      - name: Check HTML links and fragments
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --include-fragments dist/*.html

      - name: Validate EPUB
        run: |
          version=5.4.0
          archive=/tmp/epubcheck.zip
          curl --fail --location --silent --show-error \
            "https://github.com/w3c/epubcheck/releases/download/v${version}/epubcheck-${version}.zip" \
            --output "${archive}"
          echo "33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c  ${archive}" \
            | sha256sum --check
          unzip -q "${archive}" -d /tmp/epubcheck
          java -jar "/tmp/epubcheck/epubcheck-${version}/epubcheck.jar" \
            dist/science-and-engineering-of-applied-machine-learning.epub

      - name: Check PDF structure and content
        run: |
          pdfinfo dist/science-and-engineering-of-applied-machine-learning.pdf
          pdftotext -layout dist/science-and-engineering-of-applied-machine-learning.pdf /tmp/book.txt
          grep -Eq 'Chapter 1([^[:digit:]]|$)' /tmp/book.txt
          grep -Eq 'Chapter 12([^[:digit:]]|$)' /tmp/book.txt
          grep -Fq "Conclusion" /tmp/book.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: book-build-${{ github.run_id }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: book-build-${{ github.run_id }}-${{ github.sha }}
          path: dist/

      - name: Ensure release is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists. Published book versions are immutable; create a new version tag."
            exit 1
          fi

      - name: Prepare versioned release assets
        run: |
          cp dist/science-and-engineering-of-applied-machine-learning.pdf "dist/science-and-engineering-of-applied-machine-learning-${GITHUB_REF_NAME}.pdf"
          cp dist/science-and-engineering-of-applied-machine-learning.epub "dist/science-and-engineering-of-applied-machine-learning-${GITHUB_REF_NAME}.epub"
          (cd dist && zip -qr "science-and-engineering-of-applied-machine-learning-${GITHUB_REF_NAME}-html.zip" *.html assets)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: The Science and Engineering of Applied Machine Learning ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: false
          make_latest: false
          prerelease: ${{ needs.build.outputs.prerelease }}
          files: |
            dist/science-and-engineering-of-applied-machine-learning-${{ github.ref_name }}.pdf
            dist/science-and-engineering-of-applied-machine-learning-${{ github.ref_name }}.epub
            dist/science-and-engineering-of-applied-machine-learning-${{ github.ref_name }}-html.zip

  deploy:
    name: Deploy HTML site
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.prerelease == 'false'
    needs: [build, publish]
    runs-on: ubuntu-24.04
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: book-build-${{ github.run_id }}-${{ github.sha }}
          path: dist/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare site files
        run: |
          mkdir -p site
          cp dist/*.html site/
          cp -R dist/assets site/assets
          touch site/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/
          include-hidden-files: true

      - name: Deploy site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
